<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Open Desk Tutoring</title>
<link rel="icon" href="/open-desk-tutoring/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Public+Sans:wght@400;600&display=swap">
<style>
:root { --bg: #f4f6f3; --surface: #fff; --ink: #18211e; --muted: #5a6561; --line: #e1e6e2; --btn: #1f4d45; --on-btn: #f5f7f4; }
@media (prefers-color-scheme: dark) { :root { --bg: #101513; --surface: #18201d; --ink: #e9eeeb; --muted: #a3afaa; --line: #29332f; --btn: #8cc4b3; --on-btn: #0f1a17; color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Public Sans", "Helvetica Neue", system-ui, sans-serif; display: grid; place-items: center; padding: 24px 20px; line-height: 1.6; }
main { max-width: 460px; text-align: center; display: grid; gap: 1rem; justify-items: center; }
.code { font-family: "Newsreader", Georgia, serif; font-size: 5rem; line-height: 1; color: #c98d22; }
h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 2rem; margin: 0; }
p { margin: 0; color: var(--muted); }
a.btn { margin-top: .5rem; display: inline-block; background: var(--btn); color: var(--on-btn); text-decoration: none; font-weight: 600; padding: .9rem 1.4rem; border-radius: 999px; }
a.btn:focus-visible { outline: 2px solid #c98d22; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a class="btn" href="/open-desk-tutoring/">Go to the home page</a>
</main>
</body>
</html>
