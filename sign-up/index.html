<style>
:root {
  --bg: #f6f7f2; --surface: #ffffff; --ink: #15211e; --muted: #55625e; --line: #dfe4dc;
  --green: #12463f; --green-2: #1d5e55; --sun: #ffc845; --sun-soft: #ffeebd; --coral: #b3402a; --on-sun: #2a2100; --btn: #1f4d45; --on-btn: #f4f7f5;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1715; --surface: #15211e; --ink: #ecf1ec; --muted: #a3b2ad; --line: #26352f;
    --green: #0a2b26; --green-2: #1a4a43; --sun: #ffcf5c; --sun-soft: #3a3115; --coral: #f08a72; --btn: #8cc4b3; --on-btn: #0f1a17; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Public Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif; font-size: 1.0625rem; line-height: 1.6;
  display: grid; place-items: center; padding: 24px 20px; }
.card { width: 100%; max-width: 420px; background: var(--surface); border-radius: 6px; padding: 2.25rem 2rem; border: 1px solid var(--line); display: grid; gap: 1.25rem; position: relative; overflow: hidden; }
.brand { display: flex; align-items: center; gap: .65rem; font-family: "Newsreader", Georgia, serif; font-size: 1.3rem; font-weight: 500; position: relative; }
.brand svg { width: 40px; height: 40px; flex: none; }
h1 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.9rem; line-height: 1.15; margin: 0; position: relative; }
p { margin: 0; color: var(--muted); }
form { display: grid; gap: .9rem; }
label { font-weight: 700; font-size: .92rem; }
.field { display: grid; gap: .4rem; }
input[type="password"] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 6px; padding: .8rem .9rem; }
input[type="password"]:focus { outline: none; border-color: var(--green-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green-2) 18%, transparent); }
.remember { display: flex; gap: .55rem; align-items: center; font-size: .95rem; color: var(--muted); }
.remember input { width: 18px; height: 18px; accent-color: var(--green-2); }
button { font: inherit; font-weight: 700; border: 0; border-radius: 6px; padding: .9rem 1.3rem; background: var(--btn); color: var(--on-btn); cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
button:focus-visible, input:focus-visible { outline: 2px solid #b7801a; outline-offset: 3px; }
.err { color: var(--coral); font-weight: 700; font-size: .92rem; min-height: 1.4em; }
</style>

  var KEY_STORE = 'odt_key_v1';
  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function toB64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }

  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(P.s), iterations: P.i, hash: 'SHA-256' }, k, 256); });
  }
  function open(rawKey) {

      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64(P.v) }, k, b64(P.c)); })

  function show(html) {
